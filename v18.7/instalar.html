<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#041230">
<title>Instalar AJC Oficina V18.7 — Home V17.7 restaurada</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./ajc-icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="./ajc-icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial;background:linear-gradient(180deg,#020d20,#041a38);color:#eef6ff}
body{display:grid;place-items:center;padding:22px}.card{width:min(760px,100%);background:linear-gradient(180deg,#082751,#061e40);border:1px solid rgba(73,170,255,.48);border-radius:22px;padding:28px;box-shadow:0 24px 70px rgba(0,0,0,.34)}
.brand{display:flex;align-items:center;gap:14px;margin-bottom:22px}.brand img{width:66px;height:66px;border-radius:16px}.brand h1{font-size:24px;line-height:1.15;margin:0}.brand p{margin:5px 0 0;color:#9eb8d8;font-size:13px}
.ok{padding:12px 14px;border-radius:12px;background:rgba(35,201,119,.1);border:1px solid rgba(35,201,119,.35);color:#bdf6d6;margin-bottom:18px;font-size:13px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btn{min-height:52px;border-radius:12px;border:1px solid rgba(74,175,255,.65);font-weight:900;font-size:14px;cursor:pointer;padding:11px 15px}.primary{background:linear-gradient(135deg,#138fff,#22b9ff);color:#fff}.secondary{background:#071b38;color:#eaf6ff}
.help{margin-top:20px;display:grid;gap:10px}.step{display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:start;padding:11px;border-radius:12px;background:rgba(255,255,255,.035);border:1px solid rgba(115,157,211,.18)}.n{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:#0f7bd8;font-weight:900}.step strong{display:block;font-size:13px}.step span{display:block;margin-top:3px;color:#a6bad5;font-size:12px;line-height:1.45}
.status{margin-top:16px;color:#9db5d4;font-size:12px;min-height:18px}.foot{margin-top:18px;padding-top:14px;border-top:1px solid rgba(107,154,215,.2);font-size:11px;color:#7898bf}
@media(max-width:620px){body{padding:12px}.card{padding:18px;border-radius:17px}.brand h1{font-size:20px}.actions{grid-template-columns:1fr}.brand img{width:54px;height:54px}}
</style>
</head>
<body>
<main class="card">
  <div class="brand"><img src="./ajc-icon-192.png" alt="AJC Oficina"><div><h1>AJC Oficina V18.7</h1><p>Home V17.7 restaurada • computador, tablet e celular</p></div></div>
  <div class="ok">✓ Versão corrigida e preparada como aplicativo PWA em HTTPS.</div>
  <div class="actions">
    <button class="btn primary" id="install">Instalar AJC Oficina</button>
    <button class="btn secondary" id="open">Abrir AJC Oficina V18.7 — Home V17.7 restaurada</button>
  </div>
  <div class="status" id="status">Verificando a instalação disponível neste dispositivo…</div>
  <section class="help" id="help"></section>
  <div class="foot">AJC Oficina • V18.7 • Home V17.7 restaurada</div>
</main>
<script>
let deferredPrompt=null;
const statusEl=document.getElementById('status'),help=document.getElementById('help'),install=document.getElementById('install');
const ua=navigator.userAgent||'',ios=/iPad|iPhone|iPod/.test(ua)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1),android=/Android/i.test(ua),mobile=/Mobi|Android|iPhone|iPad/i.test(ua);
const standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
function steps(){
 if(standalone){help.innerHTML='<div class="step"><div class="n">✓</div><div><strong>Aplicativo já instalado</strong><span>Use o botão “Abrir AJC Oficina” acima.</span></div></div>';statusEl.textContent='AJC Oficina já está em modo aplicativo.';install.disabled=true;return}
 if(ios){help.innerHTML='<div class="step"><div class="n">1</div><div><strong>Abra pelo Safari</strong><span>Esta instalação no iPhone/iPad deve ser feita pelo Safari.</span></div></div><div class="step"><div class="n">2</div><div><strong>Toque em Compartilhar</strong><span>Use o ícone de compartilhamento do Safari.</span></div></div><div class="step"><div class="n">3</div><div><strong>Adicionar à Tela de Início</strong><span>Confirme “Adicionar”. O AJC Oficina passará a abrir como aplicativo.</span></div></div>';statusEl.textContent='No iPhone/iPad, use “Adicionar à Tela de Início”.';return}
 if(android){help.innerHTML='<div class="step"><div class="n">1</div><div><strong>Use o Chrome ou Edge</strong><span>Abra esta página no navegador.</span></div></div><div class="step"><div class="n">2</div><div><strong>Toque em “Instalar AJC Oficina”</strong><span>Se o botão do navegador não aparecer, use o menu ⋮ e escolha “Instalar app”.</span></div></div>';return}
 help.innerHTML='<div class="step"><div class="n">1</div><div><strong>Use Chrome ou Edge</strong><span>No computador, mantenha esta página aberta no navegador.</span></div></div><div class="step"><div class="n">2</div><div><strong>Clique em “Instalar AJC Oficina”</strong><span>Também é possível usar o ícone de instalação na barra de endereço.</span></div></div>';
}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;statusEl.textContent='Instalação disponível. Clique em “Instalar AJC Oficina”.';install.disabled=false});
window.addEventListener('appinstalled',()=>{deferredPrompt=null;statusEl.textContent='AJC Oficina instalado com sucesso.';install.disabled=true});
install.onclick=async()=>{
 if(ios){statusEl.textContent='Safari: Compartilhar → Adicionar à Tela de Início.';return}
 if(deferredPrompt){deferredPrompt.prompt();const r=await deferredPrompt.userChoice;statusEl.textContent=r.outcome==='accepted'?'Instalação iniciada.':'Instalação não concluída. Você pode tentar novamente.';deferredPrompt=null;return}
 statusEl.textContent=mobile?'Use o menu do navegador e escolha “Instalar app” / “Adicionar à tela inicial”.':'No Chrome/Edge, use o ícone de instalação na barra de endereço ou o menu → Instalar AJC Oficina.';
};
document.getElementById('open').onclick=()=>location.href='./?v=18.7';
if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
steps();
setTimeout(()=>{if(!deferredPrompt&&!ios&&!standalone)statusEl.textContent=mobile?'Se o botão não abrir o instalador, use o menu do navegador → Instalar app.':'Se o botão não abrir o instalador, use o ícone de instalação na barra de endereço do Chrome/Edge.'},1800);
</script>
</body>
</html>
