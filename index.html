<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#203654">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg">
<link rel="apple-touch-icon" href="./icon-192.png">
<title>AJC Oficina</title>
<style>
body{margin:0;font-family:Inter,system-ui,Segoe UI,Arial;background:#eef3f8;color:#1f3148;min-height:100vh;display:grid;place-items:center}
.box{text-align:center;padding:28px}.logo{width:82px;height:82px;border-radius:22px;background:linear-gradient(135deg,#173c70,#35a8e9);display:grid;place-items:center;color:#fff;font-size:26px;font-weight:950;margin:auto auto 18px}
button,a{display:inline-block;border:0;border-radius:13px;padding:12px 16px;font-weight:850;text-decoration:none}.retry{background:#2e8fe8;color:#fff}
</style>
</head>
<body>
<div class="box" id="loading"><div class="logo">AJC</div><h2>AJC Oficina</h2><p>Carregando aplicativo…</p></div>
<script>
if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js',{scope:'./'}).catch(()=>{});}
(async()=>{
 try{
  const r=await fetch("https://xzrzwuwvrcxsffyarkpa.supabase.co/functions/v1/ajc-oficina/",{cache:'no-store'});
  if(!r.ok) throw new Error('HTTP '+r.status);
  let html=await r.text();
  html=html.replace(/<link[^>]+rel=["']manifest["'][^>]*>/i,'<link rel="manifest" href="./manifest.webmanifest">');
  html=html.replace(/<link[^>]+apple-touch-icon[^>]*>/i,'<link rel="apple-touch-icon" href="./icon-192.png">');
  html=html.replace(/<link[^>]+rel=["']icon["'][^>]*>/i,'<link rel="icon" href="./icon.svg">');
  document.open();document.write(html);document.close();
 }catch(e){
  document.getElementById('loading').innerHTML='<div class="logo">AJC</div><h2>Sem conexão com o aplicativo</h2><p>Verifique a internet e tente novamente.</p><button class="retry" onclick="location.reload()">Tentar novamente</button>';
 }
})();
</script>
</body></html>
