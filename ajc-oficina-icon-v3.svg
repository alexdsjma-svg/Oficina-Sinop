<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#081a47"/>
      <stop offset="55%" stop-color="#0f3f95"/>
      <stop offset="100%" stop-color="#2d6df6"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#23d5f4"/>
      <stop offset="100%" stop-color="#41f0b6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#04112f" flood-opacity=".35"/>
    </filter>
  </defs>

  <rect x="22" y="22" width="468" height="468" rx="112" fill="url(#bg)" filter="url(#shadow)"/>
  <rect x="35" y="35" width="442" height="442" rx="100" fill="none" stroke="#ffffff" stroke-opacity=".12" stroke-width="4"/>

  <!-- stylized journey / road -->
  <path d="M112 355 C172 298, 208 288, 258 288 C315 288, 339 261, 392 210"
        fill="none" stroke="url(#accent)" stroke-width="20" stroke-linecap="round"/>
  <circle cx="112" cy="355" r="14" fill="#41f0b6"/>
  <circle cx="392" cy="210" r="14" fill="#23d5f4"/>

  <!-- vehicle -->
  <g transform="translate(278 300)">
    <path d="M0 40 L16 8 Q22 -2 36 -2 H92 Q106 -2 112 8 L128 40 H140 Q152 40 152 52 V78 Q152 90 140 90 H132 Q128 108 108 108 Q88 108 84 90 H48 Q44 108 24 108 Q4 108 0 90 H-8 Q-20 90 -20 78 V52 Q-20 40 -8 40 Z"
          fill="#ffffff" opacity=".95"/>
    <rect x="28" y="14" width="72" height="28" rx="8" fill="#8fd7ff"/>
    <circle cx="24" cy="88" r="12" fill="#081a47"/>
    <circle cx="108" cy="88" r="12" fill="#081a47"/>
  </g>

  <!-- AJC -->
  <text x="256" y="230" text-anchor="middle"
        font-family="Arial,Helvetica,sans-serif"
        font-size="136" font-weight="900" letter-spacing="-7"
        fill="#ffffff">AJC</text>

  <text x="256" y="408" text-anchor="middle"
        font-family="Arial,Helvetica,sans-serif"
        font-size="34" font-weight="800" letter-spacing="3"
        fill="#d8e8ff">OFICINA</text>
</svg>