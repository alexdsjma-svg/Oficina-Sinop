'pwd2').value;if(a.length<8||a!==c){m.textContent='Confira a senha: mínimo de 8 caracteres e confirmação idêntica.';return}b.disabled=true;m.textContent='Solicitando cadastro...';try{const r=await db.auth.signUp({email:'alexdsj.ma@gmail.com',password:a,options:{emailRedirectTo:location.origin+location.pathname.replace(/cadastro\.html$/,'')}});if(r.error)throw r.error;m.textContent='Cadastro solicitado. Verifique seu e-mail (inclusive Spam) para confirmar a conta. Depois, abra o sistema 5S e entre com seu e-mail e senha.'}catch(e){m.textContent='Não foi possível cadastrar: '+e.message+'. Se o cadastro estiver bloqueado, habilite novos usuários em Authentication → Providers → Email no painel Supabase.'}finally{b.disabled=false}});</script></body></html>
