<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cadastro da equipe Hyundai 5S</title><style>body{font:16px system-ui;background:#eff4f8;color:#193d5a;min-height:100vh;display:grid;place-items:center;margin:0;padding:18px}main{max-width:430px;background:white;padding:27px;border-radius:16px;box-shadow:0 10px 30px #12345622}input,button{box-sizing:border-box;width:100%;padding:12px;border-radius:9px;font:inherit;margin:8px 0}input{border:1px solid #afc2d2}button{background:#074e83;border:0;color:#fff;font-weight:bold;cursor:pointer}button:disabled{opacity:.5}a{color:#075b98}#msg{white-space:pre-wrap}</style></head><body><main><h2>Hyundai Cometa Sinop</h2><h3>Cadastro da Equipe 5S</h3><p>Este cadastro é destinado aos colaboradores previamente autorizados pelo gerente. Utilize seu e-mail e crie uma senha individual.</p><label>E-mail profissional<input id="email" type="email" autocomplete="email"></label><label>Crie uma senha<input id="pw" type="password" minlength="8" autocomplete="new-password"></label><label>Repita a senha<input id="pw2" type="password" minlength="8" autocomplete="new-password"></label><button id="go">Solicitar cadastro</button><p id="msg" role="status"></p><p><a href="./">Voltar ao Sistema 5S</a></p></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script>const db=supabase.createClient('https://xdbzohsyzjklfmkgwibe.supabase.co','sb_publishable_YSSrNIrf6Qt0GTeqOIgm0w_LBrfKbIA');document.querySelector('#go').onclick=async()=>{let b=document.querySelector('#go'),m=document.querySelector('#msg'),email=document.querySelector('#email').value.trim().toLowerCase(),pw=document.querySelector('#pw').value;if(!/^\S+@\S+\.\S+$/.test(email)||pw.length<8||pw!==document.querySelector('#pw2').value){m.textContent='Confira o e-mail e as duas senhas. A senha precisa ter 8 caracteres ou mais.';return}b.disabled=true;m.textContent='Enviando solicitação...';try{const {error}=await db.auth.signUp({email,password:pw,options:{emailRedirectTo:'https://alexdsjma-svg.github.io/Oficina-Sinop/5s/'}});if(error)throw error;m.textContent='Solicitação realizada. Verifique seu e-mail e confirme o cadastro. Seu acesso dependerá da autorização registrada pela gerência.'}catch(e){m.textContent='Não foi possível: '+e.message}finally{b.disabled=false}};</script></body></html>
